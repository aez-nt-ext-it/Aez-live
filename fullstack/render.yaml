services:
  - type: web
    name: aez-live
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:css
    startCommand: npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3100
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT_CONTENT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CRON_SECRET
        sync: false
